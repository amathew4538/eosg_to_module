name: Build static EOSG module

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build every platform and architecture (release tags always do this)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  select-build-matrix:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Choose target matrix
        id: select
        env:
          FULL_MATRIX: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.full_matrix }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          platforms = [
              ("windows-x86_64", "windows", "x86_64", "windows-latest", "4.2"),
              ("windows-arm64", "windows", "arm64", "windows-latest", "4.2"),
              ("linux-x86_64", "linux", "x86_64", "ubuntu-24.04", "4.2"),
              ("linux-arm64", "linux", "arm64", "ubuntu-24.04-arm", "4.2"),
              ("macos-arm64", "macos", "arm64", "macos-15", "4.2"),
              ("macos-x86_64", "macos", "x86_64", "macos-15-intel", "4.2"),
              ("ios-arm64", "ios", "arm64", "macos-15", "4.2"),
              ("android-arm64", "android", "arm64", "ubuntu-24.04", "godot-4.5-stable"),
              ("android-x86_64", "android", "x86_64", "ubuntu-24.04", "godot-4.5-stable"),
          ]
          if os.environ["FULL_MATRIX"].lower() != "true":
              platforms = [item for item in platforms if item[0] == "macos-arm64"]

          targets = ("editor", "template_release", "template_debug")
          include = [
              {
                  "id": f"{platform_id}-{target}",
                  "platform": platform,
                  "arch": arch,
                  "runner": runner,
                  "godot_cpp_ref": godot_cpp_ref,
                  "target": target,
              }
              for platform_id, platform, arch, runner, godot_cpp_ref in platforms
              for target in targets
          ]
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  build:
    needs: select-build-matrix
    name: ${{ matrix.platform }} / ${{ matrix.arch }} / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-build-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      - name: Check out godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ matrix.godot_cpp_ref }}
          path: epic-online-services-godot/godot-cpp
          submodules: recursive

      - name: Download EOS SDK release
        working-directory: epic-online-services-godot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
          SDK_DOWNLOAD_DIR: ${{ runner.temp }}/eos-sdk-release
          SDK_EXTRACTED_DIR: ${{ runner.temp }}/eos-sdk-extracted
        run: |
          mkdir -p "$SDK_DOWNLOAD_DIR" "$SDK_EXTRACTED_DIR"
          gh release download SDK \
            --repo amathew4538/eos-sdk-mirror \
            --pattern eos-sdk.zip \
            --pattern eos-sdk-android.zip \
            --pattern eos-sdk-ios.zip \
            --dir "$SDK_DOWNLOAD_DIR"
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          downloads = Path(os.environ["SDK_DOWNLOAD_DIR"])
          extracted = Path(os.environ["SDK_EXTRACTED_DIR"])
          destination = Path("thirdparty/eos-sdk/SDK")
          archives = sorted(path for path in downloads.iterdir() if path.is_file())
          if not archives:
              raise SystemExit("The SDK release has no downloaded assets.")

          sdk_roots = []
          for archive in archives:
              target = extracted / archive.stem
              target.mkdir(parents=True, exist_ok=True)
              if not zipfile.is_zipfile(archive):
                  continue
              with zipfile.ZipFile(archive) as source:
                  source.extractall(target)
              sdk_roots.extend(
                  folder for folder in target.rglob("SDK")
                  if "__MACOSX" not in folder.parts
                  and folder.is_dir()
                  and (folder / "Bin").is_dir()
              )

          if not sdk_roots:
              raise SystemExit("No extracted EOS SDK folder containing Bin/ was found.")
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)
          for sdk_root in sdk_roots:
              shutil.copytree(sdk_root, destination, dirs_exist_ok=True)

          required_paths = (
              destination / "Include",
              destination / "Lib",
              destination / "Bin/Android/static-stdc++/aar/eossdk-StaticSTDC-release.aar",
              destination / "Bin/IOS/EOSSDK.xcframework/Info.plist",
          )
          missing = [str(path) for path in required_paths if not path.exists()]
          if missing:
              raise SystemExit("Downloaded SDK assets are missing: " + ", ".join(missing))
          print(f"Installed SDK content from {len(sdk_roots)} release archive(s)")
          PY

      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build static library
        working-directory: epic-online-services-godot
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          SCONS_CACHE_LIMIT: 7168
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos' && '13.0' || '' }}
        run: |
          target_args=()
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            target_args+=(macos_deployment_target=13.0)
          fi
          scons \
            "${target_args[@]}" \
            target='${{ matrix.target }}' \
            platform='${{ matrix.platform }}' \
            arch='${{ matrix.arch }}' \
            threads=yes \
            dev_build=no

      - name: Collect module and SDK files
        working-directory: epic-online-services-godot
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          platform = os.environ["PLATFORM"]
          arch = os.environ["ARCH"]
          target = os.environ["TARGET"]
          artifact_id = os.environ["ARTIFACT_ID"]
          payload = Path("payload")
          addon_output = Path("sample/addons/epic-online-services-godot/bin")
          godot_cpp_output = Path("godot-cpp/bin")
          sdk_root = Path("thirdparty/eos-sdk/SDK")

          def copy_file(source, destination):
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          addon_files = [
              path for path in addon_output.rglob("*")
              if path.is_file()
              and path.name.startswith("libeosg.")
              and f".{platform}.{target}." in path.name
              and (
                  path.suffix.lower() in {".a", ".lib"}
                  or platform in {"macos", "ios"}
                  and any(parent.suffix == ".framework" for parent in path.parents)
                  and path.name == path.parent.name.removesuffix(".framework")
              )
          ]
          if not addon_files:
              raise SystemExit(f"No static EOSG archive was produced for {artifact_id}.")
          for source in addon_files:
              copy_file(source, payload / "bin/addons/eosg/bin" / source.relative_to(addon_output))

          godot_cpp_files = [
              path for path in godot_cpp_output.glob("libgodot-cpp.*")
              if path.is_file()
              and path.suffix.lower() in {".a", ".lib"}
              and f".{platform}.{target}." in path.name
              and f".{arch}" in path.name
          ]
          if not godot_cpp_files:
              raise SystemExit(f"No matching godot-cpp archive was produced for {artifact_id}.")
          for source in godot_cpp_files:
              copy_file(source, payload / "ext/godot-cpp/bin" / source.name)

          sdk_destination = payload / "sdk" / platform / arch
          include_dir = sdk_root / "Include"
          if include_dir.is_dir():
              shutil.copytree(include_dir, sdk_destination / "Include", dirs_exist_ok=True)

          if platform == "ios":
              ios_sdk = sdk_root / "Bin/IOS/EOSSDK.xcframework"
              if not ios_sdk.is_dir():
                  raise SystemExit(f"EOSSDK.xcframework is missing for {artifact_id}.")
              shutil.copytree(ios_sdk, sdk_destination / "EOSSDK.xcframework", dirs_exist_ok=True)
          elif platform == "android":
              android_sdk = sdk_root / "Bin/Android/static-stdc++"
              if not android_sdk.is_dir():
                  raise SystemExit(f"Android EOS SDK is missing for {artifact_id}.")
              shutil.copytree(android_sdk, sdk_destination / "Android", dirs_exist_ok=True)
          else:
              sdk_extensions = {".a", ".lib", ".so", ".dylib", ".dll", ".aar"}
              sdk_libraries = []

              def matches_target(path):
                  text = str(path).lower().replace("\\", "/")
                  names = {
                      "windows": ("windows", "win64", "win32", "x64", "arm64"),
                      "linux": ("linux",),
                      "macos": ("mac", "macos"),
                  }[platform]
                  if not any(token in text for token in names):
                      return False
                  explicit_x64 = any(token in text for token in ("x86_64", "x64", "win64"))
                  explicit_arm64 = "arm64" in text or "aarch64" in text
                  if arch == "arm64" and explicit_x64 and not explicit_arm64:
                      return False
                  if arch == "x86_64" and explicit_arm64:
                      return False
                  return True

              for source in sdk_root.rglob("*"):
                  if source.is_file() and source.suffix.lower() in sdk_extensions and matches_target(source):
                      copy_file(source, sdk_destination / source.relative_to(sdk_root))
                      copy_file(source, sdk_destination / "lib" / source.name)
                      sdk_libraries.append(source)
              if not sdk_libraries:
                  raise SystemExit(f"No matching EOS SDK libraries found for {artifact_id}.")
          PY
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_ID: ${{ matrix.id }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-module-${{ matrix.id }}
          path: epic-online-services-godot/payload/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  package-module:
    name: Package static module
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: static-module-*
          path: platform-artifacts

      - name: Assemble module and create zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged/eosg
          cp -a eosg/. packaged/eosg/
          for artifact in platform-artifacts/*; do
            cp -a "$artifact/." packaged/eosg/
          done
          cd packaged
          zip -9 -r ../eosg-static-module.zip eosg

      - name: Upload complete module artifact
        uses: actions/upload-artifact@v4
        with:
          name: eosg-static-module
          path: eosg-static-module.zip
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Create commit build release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.sha }}
          draft: false
          prerelease: true
          files: eosg-static-module.zip

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: eosg-static-module.zip
